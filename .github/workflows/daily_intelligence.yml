name: Daily Intelligence Sync

on:
  schedule:
    - cron: '0 19 * * *' # 7:00 PM UTC = 8:00 PM WAT (Lagos)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install httpx beautifulsoup4 pydantic pdfplumber pandas tabulate \
            pinecone langchain-huggingface sentence-transformers

      - name: Run Scraper
        run: python brain/scraper.py

      - name: Run Parser
        run: python brain/parser.py

      - name: Run Vector Engine
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: python brain/vector_engine.py

      - name: Commit and Push Data
        run: |
          git config --global user.name "Alpha-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync: New NGX Disclosures $(date +'%Y-%m-%d')" && git push)
