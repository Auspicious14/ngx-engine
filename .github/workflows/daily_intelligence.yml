name: Daily Intelligence Sync

on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  scrape_and_parse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure data directories exist
        run: |
          mkdir -p data/processed_md data/raw_pdfs
          touch data/processed_md/.gitkeep data/raw_pdfs/.gitkeep

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Parser Dependencies
        run: pip install httpx beautifulsoup4 pydantic pdfplumber pandas tabulate

      - name: Run Scraper
        run: python brain/scraper.py

      - name: Run Parser
        run: python brain/parser.py

      - name: Debug pending files
        run: |
          python -c "
          import os
          raw = [f for f in os.listdir('data/raw_pdfs') if f.endswith('.pdf')]
          done = [f for f in os.listdir('data/processed_md') if f.endswith('.md')]
          done_as_pdf = [f.replace('.md', '.pdf') for f in done]
          pending = [f for f in raw if f not in done_as_pdf]
          print(f'Raw PDFs: {len(raw)}')
          print(f'Done MDs: {len(done)}')
          print(f'Pending: {len(pending)}')
          print('First 5 pending:')
          for f in pending[:5]: print(f'  {f}')
          "

      - name: Commit Parsed Files
        run: |
          git config --global user.name "Alpha-Bot"
          git config --global user.email "actions@github.com"
          git add data/
          git status
          git diff --quiet && git diff --staged --quiet && echo "NOTHING TO COMMIT" || (git commit -m "Sync: New NGX Disclosures $(date +'%Y-%m-%d')" && git pull --rebase --strategy-option=theirs && git push && echo "PUSH SUCCESS")

      - name: Re-trigger if backlog remains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REMAINING=$(python -c "
          import os
          raw = set(f.replace('.pdf', '.md') for f in os.listdir('data/raw_pdfs') if f.endswith('.pdf'))
          done = set(f for f in os.listdir('data/processed_md') if f.endswith('.md'))
          print(len(raw - done))
          ")
          echo "Remaining: $REMAINING"
          if [ "$REMAINING" -gt "0" ]; then
            echo "🔁 Backlog remains, re-triggering..."
            gh workflow run "Daily Intelligence Sync" --ref main
          else
            echo "✅ Backlog cleared, stopping."
          fi

  vectorize:
    runs-on: ubuntu-latest
    needs: scrape_and_parse
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Ensure data directories exist
        run: mkdir -p data/processed_md data/raw_pdfs

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Vector Dependencies
        run: pip install pinecone langchain-huggingface sentence-transformers langchain-text-splitters

      - name: Run Vector Engine
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: python brain/vector_engine.py

      - name: Commit Updated DB
        run: |
          git config --global user.name "Alpha-Bot"
          git config --global user.email "actions@github.com"
          git add data/brain_metadata.db
          git diff --staged --quiet || (git commit -m "Sync: Updated vector index $(date +'%Y-%m-%d')" && git pull --rebase --strategy-option=theirs && git push)

  market_monitor:
    runs-on: ubuntu-latest
    needs: vectorize
    if: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Monitor Dependencies
        run: |
          pip install httpx pdfplumber pandas sqlalchemy psycopg2-binary \
            pinecone langchain-huggingface sentence-transformers langchain-text-splitters \
            google-genai python-dotenv

      - name: Run Market Monitor
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONPATH: .
        run: python -m brain.monitor

      - name: Commit Daily Report
        run: |
          git config --global user.name "Alpha-Bot"
          git config --global user.email "actions@github.com"
          git add DAILY_MARKET_REPORT.md
          git diff --staged --quiet || (git commit -m "Report: Daily Market Briefing $(date +'%Y-%m-%d')" && git pull --rebase --strategy-option=theirs && git push)