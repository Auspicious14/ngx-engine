name: Daily Intelligence Sync

on:
  schedule:
    - cron: '0 19 * * *' # 7:00 PM UTC = 8:00 PM WAT (Lagos)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          pip install httpx beautifulsoup4 pydantic pdfplumber pandas tabulate \
            pinecone langchain-huggingface sentence-transformers langchain-text-splitters \
            google-genai sqlalchemy

      - name: Run Scraper
        run: python brain/scraper.py

      - name: Run Parser
        run: python brain/parser.py

      - name: Run Vector Engine
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: python brain/vector_engine.py

      - name: Run Market Monitor
        run: python -m brain.monitor
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          PYTHONPATH: .
          
      - name: Commit and Push All Changes
        run: |
          git config --global user.name "Alpha-Bot"
          git config --global user.email "actions@github.com"
          # Adding everything: db updates, new PDFs, MD files, and the report
          git add data/ DAILY_MARKET_REPORT.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Sync: New NGX Data & Daily Briefing $(date +'%Y-%m-%d')" && git push)
