name: NGX Daily Ingestion

on:
  schedule:
    # Runs Monday to Friday at 17:30 WAT (Lagos Time)
    # GitHub Actions use UTC. Lagos is UTC+1. 
    # 16:30 UTC = 17:30 WAT.
    - cron: '30 16 * * 1-5'
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ingestion Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
        run: python main.py
