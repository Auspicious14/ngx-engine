name: NGX Daily Ingestion

on:
  schedule:
    # Primary run: Mon-Fri at 6:30 PM WAT (Lagos Time)
    - cron: '30 17 * * 1-5'
  workflow_dispatch: 
    inputs:
      target_date:
        description: 'Date to fetch (YYYY-MM-DD), defaults to today'
        required: false
        default: ''
      is_retry:
        description: 'Whether this is a morning retry run'
        required: false
        default: 'false'
      run_backfill:
        description: 'Run 45-day historical backfill (crawler.py)?'
        required: true
        default: false
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          NG_PROXY_URL: ${{ secrets.NG_PROXY_URL }}
          # New inputs for retry logic
          NGX_GITHUB_TOKEN: ${{ secrets.NGX_GITHUB_TOKEN }}
          NGX_GITHUB_REPO: ${{ github.repository }}
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
          INPUT_IS_RETRY: ${{ github.event.inputs.is_retry }}
        run: |
          if [ "${{ github.event.inputs.run_backfill }}" == "true" ]; then
            python crawler.py
          else
            python main.py
          fi
