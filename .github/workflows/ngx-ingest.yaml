name: NGX Daily Ingestion

on:
  schedule:
    # Runs Monday to Friday at 17:30 WAT (Lagos Time)
    - cron: '30 16 * * 1-5'
  workflow_dispatch: 
    inputs:
      run_backfill:
        description: 'Run 45-day historical backfill (crawler.py)?'
        required: true
        default: false
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Keep these if you still use them in your code
          WHATSAPP_PHONE: ${{ secrets.WHATSAPP_PHONE }}
          WHATSAPP_API_KEY: ${{ secrets.WHATSAPP_API_KEY }}
          GREEN_API_ID: ${{ secrets.GREEN_API_ID }}
          GREEN_API_TOKEN: ${{ secrets.GREEN_API_TOKEN }}
          WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
          HTTP_PROXY: ${{ secrets.NG_PROXY_URL }}
          HTTPS_PROXY: ${{ secrets.NG_PROXY_URL }}
        run: |
          if [ "${{ github.event.inputs.run_backfill }}" == "true" ]; then
            echo "🚀 Starting 45-day backfill..."
            python crawler.py
          else
            echo "📊 Running daily sync..."
            python main.py
          fi
