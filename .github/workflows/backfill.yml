name: One-Time Metadata Backfill Verify

on:
  workflow_dispatch:

permissions:
  contents: write 

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install httpx

      # - name: Run Backfill
      #   run: python brain/backfill_metadata.py

      - name: Verify Backfill
        run: python test/script/verify_backfill.py

